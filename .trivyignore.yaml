# Trivy ignore list, loaded through trivy.yaml.
#
# An entry records a finding resolved without a fix: a false-positive
# determination, or an Exception approved under the Vulnerability Management
# Policy. Every entry needs a `statement` giving its rationale and naming the
# approved exception ticket, and an `expired_at` date, after which Trivy reports
# the finding again and it must be re-justified. For example:
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       paths:
#         - package-lock.json
#       expired_at: 2027-01-31
#       statement: >-
#         Why this finding does not affect what we ship, or why it cannot be
#         fixed yet, and what would change that. Exception: <ticket link>.

vulnerabilities: []
