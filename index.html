<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <!--
            Logins started from an SSO identity provider (such as an Okta app
            tile) can't use PKCE, so Supabase sends them back with the session
            tokens in the URL fragment. Move the tokens out of the URL before any
            other script, analytics included, can read it.
            src/services/supabaseClient.ts picks them up and signs the user in.
            Skip the connector OAuth popup (/oauth), which reads its fragment.
        -->
        <script nonce="__NGINX_CSP_NONCE__">
            (function () {
                var location = window.location;
                if (
                    location.pathname === '/oauth' ||
                    location.hash.indexOf('access_token=') === -1
                ) {
                    return;
                }

                var params = new URLSearchParams(location.hash.slice(1));
                var accessToken = params.get('access_token');
                var refreshToken = params.get('refresh_token');
                if (!accessToken || !refreshToken) {
                    return;
                }

                window.__supabaseFragmentSession = {
                    access_token: accessToken,
                    refresh_token: refreshToken,
                };
                window.history.replaceState(
                    window.history.state,
                    '',
                    location.pathname + location.search
                );
            })();
        </script>

        <meta name="viewport" content="initial-scale=1, width=device-width" />
        <meta name="theme-color" content="#000000" />
        <meta name="csp-nonce" content="__NGINX_CSP_NONCE__" />

        <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
        <link rel="manifest" href="/manifest.json" />
        <title>%VITE_DEFAULT_PAGE_TITLE%</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>

        <!-- Google Tag Manager -->
        <script nonce="__NGINX_CSP_NONCE__">
            if ('%VITE_GOOGLE_TAG_MANAGER_ENABLED%' === 'true') {
                (function (w, d, s, l, i) {
                    w[l] = w[l] || [];
                    w[l].push({
                        'gtm.start': new Date().getTime(),
                        'event': 'gtm.js',
                    });
                    var f = d.getElementsByTagName(s)[0],
                        j = d.createElement(s),
                        dl = l != 'dataLayer' ? '&l=' + l : '';
                    j.async = true;
                    j.crossOrigin = 'anonymous';
                    j.src =
                        'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
                    var n = d.querySelector('[nonce]');
                    n &&
                        j.setAttribute(
                            'nonce',
                            n.nonce || n.getAttribute('nonce')
                        );
                    f.parentNode.insertBefore(j, f);
                })(
                    window,
                    document,
                    'script',
                    'dataLayer',
                    '%VITE_GOOGLE_TAG_MANAGER_ID%'
                );
            }
        </script>
        <!-- End Google Tag Manager -->
    </body>
</html>
